name: Günlük D1 yedeği

"on":
  schedule:
    # GitHub'ın saat başı yoğunluğuna takılmamak için 17. dakikada çalışır.
    - cron: "17 1 * * *"
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: d1-backup-hukuk-db
  cancel-in-progress: false

jobs:
  backup:
    name: D1'i özel R2'ye yedekle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — hareketli etiket sonradan değişmesin diye SHA sabit.

      - name: Node.js'i kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 — çalışan action kodu değişmesin diye SHA sabit.
        with:
          node-version: 22

      - name: pnpm'i kur
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 — kurulum kodu sessizce değişmesin diye commit SHA'sı sabit.
        with:
          version: 10.10.0
          run_install: false

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Dışa aktar, yükle ve geri indirerek doğrula
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d "${RUNNER_TEMP}/d1-backup.XXXXXX")"
          schema_file="${temp_dir}/schema.json"
          table_list_file="${temp_dir}/tables.txt"
          count_file="${temp_dir}/fts-count.json"
          ddl_file="${temp_dir}/fts-ddl.json"
          database_file="${temp_dir}/database.sql"
          restore_file="${temp_dir}/fts-restore.sql"
          restore_db="${temp_dir}/restore.sqlite"
          archive_file="${temp_dir}/hukuk-db.tar.gz"
          downloaded_file="${temp_dir}/r2-verify.tar.gz"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          object_path="hukuk-d1-backups/backups/${timestamp:0:4}/${timestamp:4:2}/hukuk-db-${timestamp}.tar.gz"
          object_may_exist=false
          backup_verified=false

          cleanup() {
            exit_code=$?

            # Doğrulanmamış nesne geri yüklemede gerçek yedek sanılmasın.
            if [[ "$object_may_exist" == true && "$backup_verified" != true ]]; then
              pnpm --filter ./worker exec wrangler r2 object delete "$object_path" \
                --remote \
                --force || true
            fi

            rm -f -- "$schema_file" "$table_list_file" "$count_file" "$ddl_file" \
              "$database_file" "$restore_file" \
              "$restore_db" "$archive_file" "$downloaded_file" || true
            rmdir -- "$temp_dir" || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          pnpm --filter ./worker exec wrangler d1 execute hukuk-db \
            --remote \
            --json \
            --command="SELECT name, type FROM pragma_table_list WHERE schema = 'main' ORDER BY name" \
            >"$schema_file"

          node - "$schema_file" "$table_list_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const rows = payload[0]?.success ? payload[0].results : null;

          if (!Array.isArray(rows)) throw new Error("D1 tablo listesi okunamadı");

          const virtualTables = rows.filter(({ type }) => type === "virtual").map(({ name }) => name);
          const shadowTables = rows.filter(({ type }) => type === "shadow").map(({ name }) => name);
          const expectedShadows = [
            "fts_chunks_config",
            "fts_chunks_content",
            "fts_chunks_data",
            "fts_chunks_docsize",
            "fts_chunks_idx",
          ];

          if (virtualTables.join("\n") !== "fts_chunks") {
            throw new Error(`Beklenmeyen sanal tablo: ${virtualTables.join(", ")}`);
          }
          if (shadowTables.join("\n") !== expectedShadows.join("\n")) {
            throw new Error(`Beklenmeyen FTS gölge tablosu: ${shadowTables.join(", ")}`);
          }

          const tables = rows
            .filter(({ name, type }) => type === "table" && name !== "_cf_KV" && !name.startsWith("sqlite_"))
            .map(({ name }) => name);

          if (tables.length === 0 || tables.some((name) => !/^[A-Za-z0-9_]+$/.test(name))) {
            throw new Error("Yedeklenecek uygulama tabloları güvenle belirlenemedi");
          }

          fs.writeFileSync(process.argv[3], `${tables.join("\n")}\n`);
          NODE

          app_tables=()
          while IFS= read -r table; do
            app_tables+=("$table")
          done <"$table_list_file"
          table_args=()
          count_expressions=(
            "(SELECT COUNT(*) FROM fts_chunks) AS __fts_rows"
            "(SELECT COUNT(*) FROM fts_chunks_content) AS __fts_content_rows"
          )
          for table in "${app_tables[@]}"; do
            table_args+=("--table=${table}")
            count_expressions+=("(SELECT COUNT(*) FROM \"${table}\") AS \"${table}\"")
          done
          table_args+=("--table=fts_chunks_content")

          previous_ifs="$IFS"
          IFS=,
          count_query="SELECT ${count_expressions[*]}"
          IFS="$previous_ifs"

          pnpm --filter ./worker exec wrangler d1 execute hukuk-db \
            --remote \
            --json \
            --command="$count_query" \
            >"$count_file"

          node - "$count_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const row = payload[0]?.success ? payload[0].results?.[0] : null;

          if (!row || row.__fts_rows <= 0 || row.__fts_rows !== row.__fts_content_rows) {
            throw new Error(`FTS satır sayıları uyuşmuyor: ${JSON.stringify(row)}`);
          }
          NODE

          # fts-restore.sql, FTS şemasını ELLE taşıyor. Canlı şema bir migration
          # ile değişirse (ör. yeni sütun) geri yükleme sessizce EKSİK bir indeks
          # kurar: satır sayıları tutar, bütünlük "ok" der, kayıp hiçbir yerde
          # görünmez — ve bu ancak gerçek bir felakette fark edilirdi. Bu yüzden
          # canlı DDL ile dosyadaki DDL her koşuda karşılaştırılıyor.
          pnpm --filter ./worker exec wrangler d1 execute hukuk-db \
            --remote \
            --json \
            --command="SELECT sql FROM sqlite_master WHERE name = 'fts_chunks'" \
            >"$ddl_file"

          node - "$ddl_file" worker/db/fts-restore.sql <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const live = payload[0]?.success ? payload[0].results?.[0]?.sql : null;

          if (!live) throw new Error("Canlı fts_chunks şeması okunamadı");

          const restore = fs.readFileSync(process.argv[3], "utf8");
          const declared = restore.match(/CREATE VIRTUAL TABLE[\s\S]*?\)\s*;/i);

          if (!declared) throw new Error("fts-restore.sql içinde CREATE VIRTUAL TABLE yok");

          const norm = (sql) => sql.replace(/;\s*$/, "").replace(/\s+/g, " ").trim();

          if (norm(live) !== norm(declared[0])) {
            throw new Error(
              `fts_chunks şeması fts-restore.sql ile uyuşmuyor — dosyayı güncelle.\ncanlı:   ${norm(live)}\ndosyada: ${norm(declared[0])}`
            );
          }
          NODE

          # Wrangler export çıktısında kısa ömürlü imzalı indirme adresi bulunabildiği
          # için komut çıktısını CI günlüğüne taşımıyoruz.
          pnpm --filter ./worker exec wrangler d1 export hukuk-db \
            --remote \
            --skip-confirmation \
            --output="$database_file" \
            "${table_args[@]}" \
            >/dev/null 2>&1

          cp worker/db/fts-restore.sql "$restore_file"
          test -s "$database_file"
          test -s "$restore_file"

          # Dosyanın varlığı yedek olduğunu kanıtlamaz; iki parçayı boş SQLite'a
          # uygulayıp bütünlük ve FTS satır sayısını yüklemeden önce doğruluyoruz.
          node - "$restore_db" "$database_file" "$restore_file" "$count_file" "$table_list_file" <<'NODE'
          const fs = require("node:fs");
          const { DatabaseSync } = require("node:sqlite");
          const database = new DatabaseSync(process.argv[2]);

          for (const path of process.argv.slice(3, 5)) {
            database.exec(fs.readFileSync(path, "utf8"));
          }

          const countPayload = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          const expectedCounts = countPayload[0].results[0];
          const expectedFtsRows = expectedCounts.__fts_rows;
          const restoredFtsRows = database.prepare("SELECT COUNT(*) AS total FROM fts_chunks").get().total;
          const integrity = database.prepare("PRAGMA integrity_check").get().integrity_check;
          const tables = fs.readFileSync(process.argv[6], "utf8").trim().split("\n");
          const countMismatches = tables.flatMap((table) => {
            const restored = database.prepare(`SELECT COUNT(*) AS total FROM "${table}"`).get().total;
            return restored === expectedCounts[table] ? [] : [`${table}=${restored}/${expectedCounts[table]}`];
          });
          database.close();

          if (restoredFtsRows !== expectedFtsRows || integrity !== "ok" || countMismatches.length > 0) {
            throw new Error(`Yerel geri yükleme doğrulanamadı: FTS=${restoredFtsRows}/${expectedFtsRows}, bütünlük=${integrity}, tablolar=${countMismatches.join(", ")}`);
          }
          NODE

          tar -czf "$archive_file" -C "$temp_dir" database.sql fts-restore.sql
          test -s "$archive_file"

          object_may_exist=true
          pnpm --filter ./worker exec wrangler r2 object put "$object_path" \
            --remote \
            --file="$archive_file" \
            --force

          pnpm --filter ./worker exec wrangler r2 object get "$object_path" \
            --remote \
            --file="$downloaded_file"
          cmp --silent "$archive_file" "$downloaded_file"
          backup_verified=true
